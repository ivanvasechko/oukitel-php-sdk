name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --prefer-${{ matrix.dependencies }}
      - run: composer validate --strict
      - run: composer pint -- --test
      - run: composer phpstan
      - run: composer test-coverage
      - run: composer audit
  distribution:
    name: Distribution / ${{ matrix.backend }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            backend: guzzle
          - php: '8.5'
            backend: guzzle
          - php: '8.5'
            backend: symfony
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Build and extract distribution
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p /tmp/oukitel-consumer/sdk
          composer archive --format=tar --dir=/tmp/oukitel-consumer --file=sdk --no-interaction
          tar -xf /tmp/oukitel-consumer/sdk.tar -C /tmp/oukitel-consumer/sdk
          cp "tests/Distribution/$BACKEND/composer.json" "tests/Distribution/$BACKEND/smoke.php" /tmp/oukitel-consumer/
      - run: composer install --no-interaction --prefer-dist
        working-directory: /tmp/oukitel-consumer
      - run: php smoke.php
        working-directory: /tmp/oukitel-consumer
      - name: Run installed README against HTTP mock
        if: matrix.backend == 'guzzle'
        working-directory: /tmp/oukitel-consumer
        run: php "$GITHUB_WORKSPACE/tests/Documentation/check.php" "$PWD/vendor/ivanvasechko/oukitel-php-sdk" "$PWD/vendor/autoload.php"
      - run: composer audit
        working-directory: /tmp/oukitel-consumer
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer update --no-interaction --prefer-dist
      - run: composer docs
      - run: npm ci
      - run: npm run docs:check
      - run: npm audit
  quality:
    name: Quality gate
    if: always()
    needs: [php, distribution, secrets, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          PHP_RESULT: ${{ needs.php.result }}
          SECRET_RESULT: ${{ needs.secrets.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: test "$PHP_RESULT" = success && test "$SECRET_RESULT" = success && test "$DISTRIBUTION_RESULT" = success && test "$DOCS_RESULT" = success
